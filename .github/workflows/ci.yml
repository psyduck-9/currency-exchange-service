name: CI/CD - Currency Exchange Service

on:
  push:
    branches: [ '**' ]        # Build + test on ALL branches
  pull_request:
    branches: [ main ]        # Build + test on PRs to main
  workflow_dispatch:          # Manual trigger from GitHub UI
    inputs:
      deploy:
        description: 'Deploy to AWS? (yes/no)'
        required: true
        default: 'no'

jobs:
  # ─── Job 1: Build and Test (runs on every push to any branch) ───
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean install -B -DskipTests

      - name: Run tests
        run: mvn test --file pom.xml

  # ─── Job 2: Deploy to AWS (only on push to main OR manual trigger) ───
  deploy:
    needs: build-and-test       # Only runs if build-and-test succeeds
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'yes')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build JAR
        run: mvn clean package -DskipTests -B

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image to ECR
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t 238475938485.dkr.ecr.eu-west-1.amazonaws.com/currency-exchange-service:latest \
            -t 238475938485.dkr.ecr.eu-west-1.amazonaws.com/currency-exchange-service:${{ github.sha }} \
            --push \
            .

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster currency-exchange-cluster \
            --service currency-exchange-service \
            --force-new-deployment \
            --region eu-west-1